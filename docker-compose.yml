# ====================================================================
# RADAR SECOP - ORQUESTACIÓN DOCKER COMPOSE PARA VPS LINUX
# Servicios: App (Node.js 22) + Database (PostgreSQL 17) + Proxy (Caddy SSL)
# ====================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: radar_secop_db
    restart: always
    environment:
      POSTGRES_DB: ${PGDATABASE:-radar_secop}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-secop_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-radar_secop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radar_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar_secop_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-secop_secure_password_2026}@db:5432/${PGDATABASE:-radar_secop}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-secop_secure_password_2026}
      PGDATABASE: ${PGDATABASE:-radar_secop}
      JWT_SECRET: ${JWT_SECRET:-radar_secop_jwt_prod_key_change_in_env_2026}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "3000"
    networks:
      - radar_net

  caddy:
    image: caddy:2.8-alpine
    container_name: radar_secop_caddy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - radar_net

networks:
  radar_net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
